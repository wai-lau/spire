<div id="asp" data-owner="__SPIRE_OWNER__">
  <header class="asp-head">
    <div class="asp-titlerow">
      <a class="asp-home" href="/" aria-label="home"><img src="/favicon.png?v=7" alt=""></a>
      <div class="asp-stats">
        <div class="asp-stat"><b>LIVES</b><span id="asp-lives"></span></div>
        <div class="asp-stat"><b>INTEREST</b><span id="asp-int"></span></div>
        <div class="asp-stat"><b>WAVE</b><span id="asp-wave"></span></div>
        <div class="asp-stat"><b>BEST</b><span id="asp-best"></span></div>
        <div class="asp-stat asp-ver" data-build="__SPIRE_BUILD__"><b>V</b><span>__SPIRE_VERSION__</span></div>
        <div class="asp-stat"><b>FPS</b><span id="asp-fps"></span></div>
      </div>
    </div>
  </header>
  <div class="asp-left">
    <div class="asp-wavelabel" id="asp-wavelabel">upcoming waves</div>
    <div class="asp-wavenote" id="asp-wavenote"></div>
  </div>
  <div class="asp-main">
    <div class="asp-board">
      <canvas id="asp-cv" aria-label="Playfield"></canvas>
      <div class="asp-deck asp-pop" id="asp-pop" hidden></div>
      <div class="asp-ov" id="asp-ov" hidden>
        <div id="asp-ov-right">
          <h2 id="asp-ov-title"></h2>
          <p id="asp-ov-text"></p>
          <div id="asp-ov-stats"></div>
          <div id="asp-ov-leaks"></div>
          <button class="asp-primary" id="asp-ov-btn"></button>
        </div>
      </div>
    </div>
  </div>
  <!-- the speed controls, a bar along the BOTTOM of the screen (owner) -->
  <div class="asp-controls asp-foot">
    <div class="asp-row" id="asp-speed"></div>
  </div>
  <div class="asp-bottom">
    <div class="asp-deck asp-pop asp-placing" id="asp-placing" hidden></div>
    <div class="asp-buildcol">
      <div class="asp-build" id="asp-build"></div>
      <div class="asp-powers" id="asp-powers" hidden></div>
      <div class="asp-bosshint" id="asp-bosshint"></div>
      <h1 class="asp-title">the star</h1>
    </div>
  </div>
  <div class="asp-spend-cred" id="asp-spend-cred" hidden></div>
  <button class="asp-primary asp-challenge-btn" id="asp-challenge" type="button" hidden></button>
  <div class="asp-spend" id="asp-spend" hidden><button class="asp-cancel" id="asp-spend-btn"></button></div>
  <span class="asp-sw bg" data-asp-sw="bg"></span>
  <span class="asp-sw grid" data-asp-sw="grid"></span>
  <span class="asp-sw green" data-asp-sw="green"></span>
  <span class="asp-sw threat" data-asp-sw="threat"></span>
  <span class="asp-sw violetink" data-asp-sw="violetink"></span>
  <span class="asp-sw blueink" data-asp-sw="blueink"></span>
  <span class="asp-sw chatsubo" data-asp-sw="chatsubo"></span>
  <span class="asp-sw cyan" data-asp-sw="cyan"></span>
  <span class="asp-sw orange" data-asp-sw="orange"></span>
  <span class="asp-sw glow" data-asp-sw="glow"></span>
  <span class="asp-sw pink" data-asp-sw="pink"></span>
  <span class="asp-sw white" data-asp-sw="white"></span>
  <span class="asp-sw violet" data-asp-sw="violet"></span>
  <span class="asp-sw solar" data-asp-sw="solar"></span>
  <span class="asp-sw blue" data-asp-sw="blue"></span>
  <span class="asp-sw ltblue" data-asp-sw="ltblue"></span>
  <span class="asp-sw yellow" data-asp-sw="yellow"></span>
  <span class="asp-sw tarc" data-asp-sw="tarc"></span>
  <span class="asp-sw tfrz" data-asp-sw="tfrz"></span>
  <span class="asp-sw tacd" data-asp-sw="tacd"></span>
  <span class="asp-sw tifr" data-asp-sw="tifr"></span>
  <span class="asp-sw bhdeep" data-asp-sw="bhdeep"></span>
  <span class="asp-sw bhplum" data-asp-sw="bhplum"></span>
  <span class="asp-sw bhpink" data-asp-sw="bhpink"></span>
  <span class="asp-sw bhcoral" data-asp-sw="bhcoral"></span>
  <span class="asp-sw bhwhite" data-asp-sw="bhwhite"></span>
</div>
