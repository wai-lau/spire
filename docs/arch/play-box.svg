<rect x="150" y="40" width="125.0" height="220.2" rx="6" fill="none" stroke="#58a6ff" stroke-width="2"/>
<polygon points="212.5,127.8 217.7,130.8 217.7,136.8 212.5,139.8 207.3,136.8 207.3,130.8" fill="#d29922"/>
<line x1="150" y1="133.8" x2="204.5" y2="133.8" stroke="#3fb950"/>
<line x1="220.5" y1="133.8" x2="275.0" y2="133.8" stroke="#3fb950"/>
<line x1="212.5" y1="40" x2="212.5" y2="125.8" stroke="#f778ba"/>
<line x1="212.5" y1="141.8" x2="212.5" y2="260.2" stroke="#f778ba"/>
<text x="181.2" y="129.8" font-size="7.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#3fb950">side 250</text>
<text x="243.8" y="129.8" font-size="7.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#3fb950">side 250</text>
<text x="146.0" y="136.8" font-size="7.5" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#3fb950">VIEW_SIDE</text>
<text x="216.5" y="86.9" font-size="8" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#f778ba">VIEW_UP 375</text>
<text x="216.5" y="96.9" font-size="8" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#f778ba">= 1.5 x side</text>
<text x="216.5" y="197.0" font-size="8" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#f778ba">VIEW_DOWN ~506</text>
<text x="64.0" y="254.2" font-size="7.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">a wider window: the box fits, centred;</text>
<text x="64.0" y="270.2" font-size="7.5" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">no more board than a phone</text>
<text x="212.5" y="32.0" font-size="9" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#58a6ff">the play box (PHONES x PHONE_ZOOM 0.72)</text>
<text x="220.0" y="283.0" font-size="8" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">every screen zooms to fit this box (resize)</text>
<text x="220.0" y="296.0" font-size="8" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">it is also the towers' movement cap (legalSpot -&gt; phoneInside)</text>
