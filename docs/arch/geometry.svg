<text x="486.7" y="216.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#58a6ff">spawn</text>
<text x="300.0" y="45.4" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">RIM_R 482</text>
<text x="300.0" y="12.0" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">SPAWN_R 600</text>
<text x="379.0" y="204.0" font-size="10" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">r 250 u</text>
<text x="530.0" y="40.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">12 lanes, 30 deg apart, in mirror pairs;</text>
<text x="530.0" y="57.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#58a6ff">only the odd twin is ridden (bold):</text>
<text x="530.0" y="74.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">EVERYTHING RIDES CLOCKWISE</text>
<text x="530.0" y="108.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">lane: lead-in LEAD_R 2400 -&gt; R0 760,</text>
<text x="530.0" y="125.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">then an Archimedean spiral to the core;</text>
<text x="530.0" y="142.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">one pair a type (TYPE_PAIR, PAIR_TURNS)</text>
<text x="530.0" y="176.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">spawn (dot): the lane's first crossing</text>
<text x="530.0" y="193.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">of SPAWN_R 600 - every spawn equidistant</text>
<text x="530.0" y="227.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">r 250 u (dotted): where 'time</text>
<text x="530.0" y="244.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">under fire' is measured</text>
<text x="530.0" y="278.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">slots: six hexes at SLOT_R 78,</text>
<text x="530.0" y="295.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#3fb950">THREE open (green): -120 / 0 / 120</text>
<text x="530.0" y="329.0" font-size="11" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#8b949e">core: a hexagon, CORE_R 25</text>
</svg>
